<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1d24"/>
      <stop offset="100%" stop-color="#121318"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#e09f3e"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#ffd166" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="#ffd166" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Inner subtle grid pattern -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#34384a" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- Elephant Icon Graphic -->
  <g transform="translate(64, 80) scale(0.75)" filter="url(#goldGlow)">
    <!-- Elephant Head & Body -->
    <path d="M 380 320 
             L 380 230 
             C 380 140 330 80 230 80 
             C 140 80 90 140 90 230 
             L 90 380 
             L 130 380 
             L 130 280 
             C 130 260 145 250 160 250 
             C 175 250 190 260 190 280 
             L 190 380 
             L 230 380 
             L 230 300 
             C 230 280 245 270 260 270 
             C 275 270 290 280 290 300 
             L 290 380 
             L 330 380 
             L 330 280 
             C 330 250 350 240 370 260 
             L 380 320 Z" 
          fill="url(#goldGrad)"/>

    <!-- Large African Ear Flap -->
    <path d="M 190 140 
             C 130 130 60 160 50 240 
             C 40 300 90 350 160 330 
             C 180 325 190 300 190 280 
             Z" 
          fill="#ffd166" opacity="0.9" stroke="#e09f3e" stroke-width="3"/>

    <!-- Curved Trunk with Gripping Tip -->
    <path d="M 340 180 
             C 370 190 410 220 420 270 
             C 430 320 390 360 350 360 
             C 330 360 320 345 330 335 
             C 340 325 365 330 380 310 
             C 390 290 375 250 340 230 
             Z" 
          fill="url(#goldGrad)"/>

    <!-- White Polished Ivory Tusk -->
    <path d="M 320 250 
             C 340 270 380 290 420 275 
             C 390 310 330 300 305 270 
             Z" 
          fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Intelligent Eye -->
    <circle cx="275" cy="175" r="9" fill="#121318"/>
    <circle cx="278" cy="173" r="3" fill="#ffffff"/>

    <!-- Mini Pixel/Scientific Emblem Badge -->
    <rect x="230" y="415" width="50" height="12" rx="4" fill="#ffd166" opacity="0.8"/>
  </g>

  <!-- App Title Bottom Branding -->
  <text x="256" y="445" font-family="'Silkscreen', 'Plus Jakarta Sans', monospace, sans-serif" font-size="30" font-weight="bold" fill="#ffd166" text-anchor="middle" letter-spacing="4">СЛОНОЛОГИЯ</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#8e96ac" text-anchor="middle" letter-spacing="3">WIKI • PWA</text>
</svg>
